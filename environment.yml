name: sfsa_rag_assistant
channels:
  - defaults
  - conda-forge
  - pytorch
  # - fastai
dependencies:
  - python==3.11
  - pip
  - setuptools
  - setuptools_scm
  # BASICS
  - numpy
  - scipy==1.14.1
  # - pandas
  - tqdm==4.67.0
  - click==8.1.7
  - ipython
  # VISUALIZATION
  # - matplotlib
  - ipympl  # interactive matplotlib plots
  - seaborn
  # - altair
  # - yellowbrick
  # ML, STATS & DEEP LEARNING
  # - statsmodels
  # - scikit-learn
  # - sktime
  # - tslearn
  # - xgboost
  # - catboost
  # - lightgbm
  # - pytorch
  # - fastai  # activate fastai channel above!
  # - tensorflow
  # - keras
  # - spacy
  # OTHER TOOLS
  # - optuna
  # - dask
  # - snakeviz
  - pip:
     - -e .  # install git checkout of sfsa_rag_assistant in editable mode
     # LangChain ecosystem
     - langchain==1.2.10
     - langchain-community==0.4.1
     - langchain-core==1.2.11
     - langchain-huggingface==1.2.0
     - langchain-ollama==1.0.1
     - langgraph==1.0.8
     - langsmith==0.7.1
     # Document processing
     - pymupdf==1.27.1
     - sentence-transformers==5.2.2
     - faiss-cpu==1.13.2
     - transformers==4.57.6
     - tokenizers==0.22.2
     # Web search -- disabled by project decision (Dave/SFSA 2026-09-17, reaffirmed by
     # Revanth 2026-09-28): not installed, so the capability doesn't exist on this box,
     # not just switched off. The code already handles the package being absent (a plain
     # log line + empty results, see nodes/web_search.py), so nothing else depends on this.
     # To re-enable: uncomment, set SFSA_WEB_SEARCH_ENABLED=true and a real TAVILY_API_KEY,
     # and add a decision-log entry.
     # - tavily-python==0.7.21
     # Configuration and validation
     - pydantic==2.12.5
     - pydantic-settings==2.12.0
     - python-dotenv==1.2.1
     # Utilities
     - requests
     - httpx-sse==0.4.3
     - gradio==5.35.0
     # add here only pip-packages that are not available in conda/conda-forge! E.g.:
     # - icecream
     # - jax
     # - numpyro
     # - funsor
     # - neptune-client
     # - neptune-contrib

  # DEVELOPMENT ONLY PACKAGES (could also be kept in a separate environment file)
  - jupyterlab
  - pytest
  - pytest-cov
  - tox
  - pre_commit
  - nbdime
  - nbstripout
  - sphinx
  - recommonmark
